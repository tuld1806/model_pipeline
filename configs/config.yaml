# Pipeline Configuration File

# WandB Logging Settings
wandb:
  project: "dl-flexible-pipeline"
  entity: null               # User or team name in WandB (null uses default account)
  run_name: "exp_baseline_resnet18"
  mode: "online"             # Options: "online", "offline", "disabled"
  save_code: true
  tags: ["classification", "baseline"]

# Model Settings
model:
  name: "SimpleResNet"       # Class name in arch.py (e.g., SimpleResNet, CustomMLP, MobileNetV3Custom)
  num_classes: 10
  in_channels: 3
  weights_path: null         # Optional: path to .pth file to load weights (e.g., "checkpoints/best_model.pth")
  strict_load: true          # Whether to strictly enforce key matching when loading state_dict
  kwargs:                    # Additional keyword arguments to pass to model constructor
    dropout_rate: 0.2

# Dataset & DataLoader Settings
data:
  dataset_type: "synthetic"  # Options: "synthetic", "image_folder", "csv"
  train_path: "data/train"
  val_path: "data/val"
  test_path: "data/test"
  image_size: [224, 224]
  batch_size: 32
  num_workers: 4
  pin_memory: true

# Training Hyperparameters
training:
  seed: 42
  epochs: 10
  device: "cuda"             # Options: "cuda", "cpu", "auto"
  use_amp: true              # Mixed precision training (Automatic Mixed Precision)
  save_dir: "checkpoints"
  save_best_only: true
  monitor_metric: "val_accuracy" # Options: "val_loss", "val_accuracy", "val_f1"
  mode: "max"                # Options: "max" for accuracy/f1, "min" for loss
  early_stopping_patience: 5

# Optimizer Settings
optimizer:
  name: "AdamW"              # Options: "Adam", "AdamW", "SGD", "RMSprop"
  lr: 0.001
  weight_decay: 0.01
  momentum: 0.9              # Used if SGD

# Loss Function Settings
loss:
  name: "CrossEntropyLoss"   # Options: "CrossEntropyLoss", "BCEWithLogitsLoss", "MSELoss", "FocalLoss"
  label_smoothing: 0.0

# Learning Rate Scheduler Settings
scheduler:
  name: "CosineAnnealingLR"  # Options: "CosineAnnealingLR", "StepLR", "ReduceLROnPlateau", null
  T_max: 10
  eta_min: 0.00001
  step_size: 5               # For StepLR
  gamma: 0.1                 # For StepLR
  patience: 3                # For ReduceLROnPlateau
